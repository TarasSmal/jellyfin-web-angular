<section
  aria-label="Mini player"
  class="pointer-events-none absolute inset-0 flex flex-col justify-between"
>
  <div
    class="pointer-events-auto flex items-start gap-2 bg-gradient-to-b from-black/80 to-transparent px-2 py-1.5"
  >
    <div class="min-w-0 flex-1">
      <p class="truncate text-xs font-medium">{{ title() }}</p>
      @if (subtitleLine(); as line) {
        <p class="truncate text-[0.7rem] text-text-muted">{{ line }}</p>
      }
    </div>
    <button
      type="button"
      class="shrink-0 cursor-pointer text-text-muted transition-colors hover:text-text"
      (click)="expand()"
      aria-label="Expand player"
      title="Expand"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
        />
      </svg>
    </button>
    <button
      type="button"
      class="shrink-0 cursor-pointer text-text-muted transition-colors hover:text-text"
      (click)="close()"
      aria-label="Stop playback"
      title="Stop"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
</section>
