<header
  class="fixed inset-x-0 top-0 z-40 bg-gradient-to-b from-black/80 via-black/40 to-transparent"
>
  <nav class="flex h-16 items-center gap-4 overflow-x-auto px-4 md:gap-6 md:px-12">
    <a routerLink="/" class="text-xl font-bold tracking-tight text-accent">Jellyfin</a>
    @for (view of libraries(); track view.Id) {
      <a
        [routerLink]="['/library', view.Id]"
        routerLinkActive="text-text"
        class="shrink-0 text-sm font-medium text-text-muted transition-colors hover:text-text"
      >
        {{ view.Name }}
      </a>
    }
    @if (session.isAdmin()) {
      <a
        routerLink="/admin"
        routerLinkActive="text-text"
        class="shrink-0 text-sm font-medium text-text-muted transition-colors hover:text-text"
      >
        Admin
      </a>
    }
    <span class="flex-1"></span>
    <input
      type="search"
      placeholder="Search"
      class="w-24 shrink-0 rounded-full border border-border bg-surface/80 px-4 py-1.5 text-sm placeholder:text-text-faint focus:w-40 focus:border-accent focus:outline-none transition-all sm:w-40 sm:focus:w-56"
      [value]="searchTerm()"
      (input)="onSearch($event)"
    />
    <a
      routerLink="/profile"
      routerLinkActive="text-text"
      class="flex shrink-0 items-center gap-2 text-sm text-text-muted transition-colors hover:text-text"
    >
      @if (avatarUrl(); as src) {
        <img [src]="src" alt="" class="size-7 rounded-full border border-border object-cover" />
      } @else {
        <span
          aria-hidden="true"
          class="flex size-7 items-center justify-center rounded-full border border-border bg-surface-raised text-xs font-semibold"
        >
          {{ initial() }}
        </span>
      }
      <span class="hidden sm:inline">{{ session.user()?.Name }}</span>
      <span class="sr-only">Your profile</span>
    </a>
    <button
      type="button"
      class="text-sm text-text-muted transition-colors hover:text-text"
      (click)="logout()"
    >
      Sign out
    </button>
  </nav>
</header>
<router-outlet />
